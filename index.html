<!DOCTYPE html>
<html>
    <head>
        <title>gun-shop</title>
        <link rel = "stylesheet" href ="styles.css">
        <script src='https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js'></script>
    </head>
    <body>
        <header>
                <img src="https://static.vecteezy.com/system/resources/thumbnails/024/849/472/small_2x/gun-gold-metal-transparent-background-png.png" width="50px" height="50px">
                <div class="btns">
                    <div class="btn btn0" onclick="document.getElementById('catalog').scrollIntoView({behavior: 'smooth'})">Каталог</div>
                    <div class="btn btn1" onclick="document.getElementById('gallery').scrollIntoView({behavior: 'smooth'})">Галерея</div>
                    <div class="btn btn2" onclick="document.getElementById('contact').scrollIntoView({behavior: 'smooth'})">Контакты</div>
                </div>
        </header>
        <main>
            <h1 class = 'fe' id="catalog">КАТАЛОГ</h1>
            <div class='merch-wrapper'>
                <div class='merch-item merch1'>
                    <div class='merch-item-top'></div>
                    <div class='merch-item-bottom'>
                        <h2 class='merch-item-name'>[название]</h2>
                        <p class='merch-item-descr'>[описание]</p>
                        <div class='add-to-cart-group'>
                            <div class='add-to-cart-btn'><i class='fa-solid fa-cart-shopping'></i></div>&nbsp;- <span class='merch-item-price'>[цена]</span>р.
                        </div>
                    </div>
                </div>
                <div class='merch-item merch2'>
                    <div class='merch-item-top'></div>
                    <div class='merch-item-bottom'>

                        </div>
                    </div>
                </div>
                <div class='merch-item merch3'>
                    <div class='merch-item-top'></div>
                    <div class='merch-item-bottom'>
                        <h2 class='merch-item-name'>[название]</h2>
                        <p class='merch-item-descr'>[описание]</p>
                        <div class='add-to-cart-group'>
                            <div class='add-to-cart-btn'><i class='fa-solid fa-cart-shopping'></i></div>&nbsp;- <span class='merch-item-price'>[цена]</span>р.
                        </div>
                    </div>
                </div>
                <div class='merch-item merch4'>
                    <div class='merch-item-top'></div>
                    <div class='merch-item-bottom'>
                        <h2 class='merch-item-name'>[название]</h2>
                        <p class='merch-item-descr'>[описание]</p>
                        <div class='add-to-cart-group'>
                            <div class='add-to-cart-btn'><i class='fa-solid fa-cart-shopping'></i></div>&nbsp;- <span class='merch-item-price'>[цена]</span>р.
                        </div>
                    </div>
                </div>
            </div>
            <h1 id="gallery">ГАЛЕРЕЯ</h1>
            <div class="gallery">
                <img src="https://www.armoury-online.ru/assets/photo/9658449.jpg" alt="описание" class="img img0">
                <img src="https://www.bon-cadeau.ru/mediares/image/pinfire-miniguns.jpg" alt="описание" class="img img1">
                <img src="https://vancouverok.com/wp-content/webp-express/webp-images/uploads/2016/12/seized_firearms-1.jpg.webp" alt="описание" class="img img2">
                <img src="https://academycrafts.ru/upload/medialibrary/802/odqawgh86tyalwc02t8wfcv17m1atx41/istoriya_atributsiya_star_khol_oruzhiya_oblogka.jpg" alt="описание" class="img img3">
